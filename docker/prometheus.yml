global:
  scrape_interval: 15s

scrape_configs:
  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8081"]

  - job_name: reservation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["reservation-service:8082"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
